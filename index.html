<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mor'Agent AI | Quantum Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
<style>
  :root { --neon-cyan: #00f3ff; --neon-purple: #b800ff; --neon-green: #00ff41; --bg-dark: #020206; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', sans-serif; }
  body { background-color: var(--bg-dark); color: #fff; overflow-x: hidden; min-height: 100vh; }
  #canvas-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(2, 2, 6, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 243, 255, 0.1); position: fixed; width: 100%; top: 0; z-index: 100; }
  .logo { font-family: 'Orbitron', monospace; font-size: 1.8rem; font-weight: 900; letter-spacing: 3px; background: linear-gradient(90deg, #fff, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
  .btn-nav { border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 10px 25px; border-radius: 8px; font-family: 'Orbitron'; font-weight: 700; text-decoration: none; transition: all 0.3s ease; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
  .btn-nav:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 30px var(--neon-cyan); transform: translateY(-2px); }
  .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; position: relative; }
  .hero h1 { font-family: 'Orbitron', monospace; font-size: 4rem; font-weight: 900; line-height: 1.1; margin-bottom: 20px; text-transform: uppercase; animation: textGlow 3s infinite alternate; }
  @keyframes textGlow { 0% { text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-purple); } 100% { text-shadow: 0 0 40px var(--neon-green), 0 0 80px var(--neon-cyan); } }
  .hero p { font-size: 1.2rem; color: #aaa; max-width: 700px; margin-bottom: 40px; line-height: 1.6; }
  .btn-main { background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple)); color: #fff; padding: 20px 60px; border-radius: 12px; font-family: 'Orbitron'; font-size: 1.2rem; font-weight: 900; text-decoration: none; text-transform: uppercase; letter-spacing: 2px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 30px rgba(184, 0, 255, 0.4); border: 1px solid rgba(255,255,255,0.2); }
  .btn-main:hover { transform: scale(1.05) translateY(-5px); box-shadow: 0 0 60px rgba(0, 243, 255, 0.8); }
</style>
</head>
<body>
<canvas id="canvas-bg"></canvas>
<nav>
  <div class="logo">MOR'TEK</div>
  <a href="app.html" class="btn-nav">INITIATE LAUNCH</a>
</nav>
<section class="hero">
  <h1>Quantum<br>Intelligence</h1>
  <p>The ultimate geometric synthesis of South African CAPS curriculum. Ascend your academic reality.</p>
  <a href="app.html" class="btn-main">ENTER THE MATRIX</a>
</section>
<script>
  const canvas = document.getElementById('canvas-bg'); const ctx = canvas.getContext('2d'); let width, height;
  function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*'; const fontSize = 14; let columns = width / fontSize; let drops = [];
  for (let i = 0; i < columns; i++) drops[i] = Math.random() * -100;
  const shapes = [];
  for (let i = 0; i < 15; i++) { shapes.push({ x: Math.random() * width, y: Math.random() * height, size: Math.random() * 100 + 50, speedX: (Math.random() - 0.5) * 3, speedY: (Math.random() - 0.5) * 3, angle: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.05 }); }
  function draw() {
    ctx.fillStyle = 'rgba(2, 2, 6, 0.15)'; ctx.fillRect(0, 0, width, height);
    ctx.font = fontSize + 'px Orbitron';
    for (let i = 0; i < drops.length; i++) { const text = chars[Math.floor(Math.random() * chars.length)]; ctx.fillStyle = Math.random() > 0.95 ? '#b800ff' : '#00f3ff'; ctx.fillText(text, i * fontSize, drops[i] * fontSize); if (drops[i] * fontSize > height && Math.random() > 0.975) { drops[i] = 0; } drops[i] += 1.5; }
    shapes.forEach(s => { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.angle); ctx.beginPath(); ctx.moveTo(0, -s.size/2); ctx.lineTo(s.size/2, s.size/2); ctx.lineTo(-s.size/2, s.size/2); ctx.closePath(); ctx.strokeStyle = 'rgba(0, 243, 255, 0.3)'; ctx.lineWidth = 2; ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, s.size/3, 0, Math.PI*2); ctx.strokeStyle = 'rgba(184, 0, 255, 0.2)'; ctx.stroke(); ctx.restore(); s.x += s.speedX; s.y += s.speedY; s.angle += s.rotSpeed; if (s.x > width || s.x < 0) s.speedX *= -1; if (s.y > height || s.y < 0) s.speedY *= -1; });
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
